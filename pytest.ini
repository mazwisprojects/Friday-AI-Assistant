[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Isolated tmp root: pytest wipes it every session, so a stale/poisoned global
# %TEMP% root can never crash sessionfinish cleanup and fake test failures.
addopts = --basetemp=.pytest_tmp
